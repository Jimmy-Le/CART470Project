    <section class="controls" aria-label="Current editor">
      <div class="toolbar">
        <button id="add" type="button">+ Add current</button>
        <button id="overview" type="button">Overview</button>
        <button id="pause" type="button" aria-pressed="false">Pause</button>
      </div>
      <p id="status" role="status">Add a current, then choose two points in the water.</p>
      <div class="edit-row">
        <label>Current <select id="routes" aria-label="Selected current"></select></label>
        <label>Speed <input id="speed" type="range" min="0" max="150" step="1" value="35"><output id="speed-value">35 map px/s</output></label>
        <label>Width <input id="width" type="range" min="20" max="180" step="2" value="70"><output id="width-value">70 map px</output></label>
        <label>Strength <input id="strength" type="range" min="0" max="2" step="0.05" value="1"><output id="strength-value">1.00</output></label>
        <button id="reverse" type="button">Reverse</button>
        <button id="delete" type="button">Delete</button>
      </div>
    </section>
